<span>
  <link rel="stylesheet" href="assets/ui/components/button.css" />
  <link rel="stylesheet" href="assets/ui/components/floating-menu.css" />
  <link rel="stylesheet" href="assets/ui/components/icon-badge.css" />

  <style>
    :root {
      --ui-anim-duration: 0.3s;
    }

    .drop-shadow {
      filter: drop-shadow(0.1rem 0.4rem 0.1rem rgba(0, 0, 0, 0.3));
    }

    .loop-state--inGame[data-game-state]:not([data-game-state='inGame']) {
      display: none;
    }

    .loop-state--paused,
    .loop-state--gameWin,
    .loop-state--gameOver {
      pointer-events: all;
      opacity: 1;
      transition: opacity 0.1s 0.2s;
    }

    .loop-state--paused[data-game-state]:not([data-game-state='paused']),
    .loop-state--gameWin[data-game-state]:not([data-game-state='gameWin']),
    .loop-state--gameOver[data-game-state]:not([data-game-state='gameOver']) {
      pointer-events: none;
      display: none;
      opacity: 0;
      transition: opacity 0.1s;
    }
  </style>
</span>
