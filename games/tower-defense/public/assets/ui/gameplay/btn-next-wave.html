<div class="btn-next-wave btn-next-wave--visible-{{btnNext.visible}} mb-2 p-1">
  <text-button @click="btnNext.onClick" label="Next Wave"></text-button>

  <style>
    .btn-next-wave {
      transform-origin: center;
      animation: pulse 1.6s infinite;
    }

    .btn-next-wave--visible-false {
      opacity: 0;
      transform: scale(0.5);
      transition: opacity var(--ui-anim-duration),
        transform var(--ui-anim-duration);
    }

    .btn-next-wave--visible-true {
      opacity: 1;
      transform: scale(1);
      transition: opacity var(--ui-anim-duration),
        transform var(--ui-anim-duration);
    }

    /* create pulse animation */
    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</div>
