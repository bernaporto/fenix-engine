<main class="ui-container">
  <fnx-component path="assets/ui/gameplay/default-styles"></fnx-component>

  <!-- ON GAME -->
  <section
    class="ui-container loop-state--inGame"
    data-game-state="{{loopState}}"
  >
    <!-- PLAYER STATS -->
    <section class="anchor--top-left">
      <fnx-component path="assets/ui/gameplay/player-stats"></fnx-component>
    </section>

    <!-- WAVE STATS -->
    <section class="anchor--top-right">
      <fnx-component path="assets/ui/gameplay/wave-stats"></fnx-component>
    </section>

    <!-- NEXT WAVE BUTTON -->
    <section class="anchor--bottom-center">
      <fnx-component path="assets/ui/gameplay/btn-next-wave"></fnx-component>
    </section>
  </section>

  <!-- PAUSE -->
  <section
    class="ui-container loop-state--paused"
    data-game-state="{{loopState}}"
  >
    <fnx-component path="assets/ui/gameplay/paused"></fnx-component>
  </section>

  <!-- GAME WIN & GAME OVER -->
  <section
    class="ui-container loop-state--gameWin"
    data-game-state="{{loopState}}"
  >
    <fnx-component path="assets/ui/gameplay/game-win"></fnx-component>
  </section>

  <section
    class="ui-container loop-state--gameOver"
    data-game-state="{{loopState}}"
  >
    <fnx-component path="assets/ui/gameplay/game-over"></fnx-component>
  </section>

  <style>
    .loop-state--inGame[data-game-state]:not([data-game-state='inGame']) {
      display: none;
    }

    .loop-state--paused,
    .loop-state--gameWin,
    .loop-state--gameOver {
      pointer-events: all;
      opacity: 1;
      transition: opacity 0.1s 0.2s;
    }

    .loop-state--paused[data-game-state]:not([data-game-state='paused']),
    .loop-state--gameWin[data-game-state]:not([data-game-state='gameWin']),
    .loop-state--gameOver[data-game-state]:not([data-game-state='gameOver']) {
      pointer-events: none;
      display: none;
      opacity: 0;
      transition: opacity 0.1s;
    }
  </style>
</main>
