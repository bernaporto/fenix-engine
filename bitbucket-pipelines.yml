image: node:24

definitions:
  caches:
    pnpm: .pnpm-store

pipelines:
  default:
    - step:
        name: Validate workspace
        caches:
          - pnpm
        script:
          - npm install --global pnpm@10.20.0
          - pnpm install --frozen-lockfile --store-dir .pnpm-store
          - pnpm lint
          - pnpm build:examples
          - pnpm test
