<fnx-fullscreen-container padding="1rem" color="white">
  <!-- Top left corner -->
  <fnx-anchor preset="top-left">
    <fnx-hstack spacing="1rem">
      <fnx-text>Top left corner w/ vertical stack</fnx-text>
      <fnx-text>Angle: {{ angle }}</fnx-text>
    </fnx-hstack>
  </fnx-anchor>

  <!-- Top right corner -->
  <fnx-anchor preset="top-right">
    <fnx-vstack spacing="1rem">
      <fnx-text>Top right corner w/ horizontal stack</fnx-text>
      <fnx-hstack>
        <fnx-icon path="{{ coins.icon }}" />
        <fnx-text>{{ coins.value }}</fnx-text>
      </fnx-hstack>
    </fnx-vstack>
  </fnx-anchor>

  <!-- Bottom center -->
  <fnx-anchor preset="bottom-center">
    <fnx-button onclick="{{ onClickButton }}">Click Me</fnx-button>
  </fnx-anchor>

  <fnx-center enabled="{{ status === 'paused' }}">
    <fnx-text>Paused</fnx-text>
  </fnx-center>
</fnx-fullscreen-container>
